<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crachá Aço · Grupo Ragga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <section class="stage" id="stage">
      <canvas id="scene"></canvas>
      <p class="hint">Arraste para girar</p>
    </section>

    <aside class="panel">
      <header class="panel-head">
        <h1>Crachá</h1>
        <span class="tag">BETA</span>
      </header>

      <div class="field">
        <span class="label" id="brandLabel">Marca</span>
        <div class="brand-grid" role="radiogroup" aria-labelledby="brandLabel" id="brands"></div>
      </div>

      <div class="field">
        <label class="label" for="logoInk">Cor do logo</label>
        <div class="select"><select id="logoInk"></select></div>
      </div>

      <div class="field">
        <span class="label">Tecido</span>
        <div class="chips" role="radiogroup" aria-label="Cor do tecido" id="fabrics"></div>
      </div>

      <div class="field">
        <span class="label">Vista</span>
        <div class="seg" role="radiogroup" aria-label="Vista" id="view">
          <button type="button" role="radio" data-view="front" aria-checked="true">Frente</button>
          <button type="button" role="radio" data-view="back" aria-checked="false">Verso</button>
        </div>
      </div>

      <label class="field">
        <span class="label">Primeiro nome</span>
        <input id="name" type="text" maxlength="18" value="Marina" placeholder="Em branco: some do crachá" autocomplete="off" spellcheck="false" />
      </label>

      <div class="field">
        <label class="label" for="role">Cargo</label>
        <input id="role" type="text" maxlength="28" value="Gerente de Loja" placeholder="Em branco: some do crachá" autocomplete="off" spellcheck="false" />
        <div class="chips" id="roleChips" aria-label="Cargos desta marca"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
